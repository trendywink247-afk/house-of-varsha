# RuFlo V3 Runtime Configuration
# House of Varsha - Hostinger VPS
# Server: srv1750.hstgr.io | IP: 145.223.17.226 | Location: India

version: "3.0.0"

server:
  name: srv1750
  ip: 145.223.17.226
  location: asia-india
  maxProcesses: 120
  ram: 3072
  cpuCores: 2

swarm:
  topology: hierarchical
  maxAgents: 8
  autoScale: true
  coordinationStrategy: consensus

memory:
  backend: mysql
  enableHNSW: false
  persistPath: .claude-flow/data
  cacheSize: 50
  mysql:
    host: localhost
    user: u524306250_ruflo
    database: u524306250_ruflo
    port: 3306
  learningBridge:
    enabled: true
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: true
    pageRankDamping: 0.85
    maxNodes: 2000
    similarityThreshold: 0.8
  agentScopes:
    enabled: true
    defaultScope: project

neural:
  enabled: false
  modelPath: .claude-flow/neural

hooks:
  enabled: true
  autoExecute: true

mcp:
  autoStart: true
  port: 3001

project:
  name: house-of-varsha
  domain: houseofvarsha.in
  stack: react-vite-express
  nodeVersion: "22"
  deployPath: /home/u524306250/domains/houseofvarsha.in/public_html
  sourcePath: /home/u524306250/house-of-varsha-src
